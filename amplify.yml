version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline --no-audit --no-fund --legacy-peer-deps
        - npm install --prefix amplify/functions/staff-users --cache .npm --prefer-offline --no-audit --no-fund --legacy-peer-deps
        - npm install --prefix amplify/functions/field-users --cache .npm --prefer-offline --no-audit --no-fund --legacy-peer-deps
        - export PATH="$PWD/node_modules/.bin:$PATH"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install --cache .npm --prefer-offline --no-audit --no-fund --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
